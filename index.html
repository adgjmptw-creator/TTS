<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="description" content="ブラウザで動くシンプルなテキスト読み上げアプリ。オフラインでも動作します。" />
<title data-i18n="app.title">ながら読み上げ</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-header">
  <h1 class="app-title" data-i18n="app.title">ながら読み上げ</h1>
  <div class="header-actions">
    <label class="lang-switch">
      <span class="sr-only" data-i18n="header.uiLang">UI 言語</span>
      <select id="ui-lang" aria-label="UI language">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
</header>

<main class="app-main">
  <section class="text-section" aria-labelledby="text-label">
    <div class="section-head">
      <label id="text-label" for="text-input" class="section-title" data-i18n="text.label">読み上げたいテキスト</label>
      <div class="text-meta">
        <span id="char-count" class="char-count" aria-live="polite">0</span>
        <span data-i18n="text.chars">文字</span>
        <button id="clear-btn" class="link-btn" type="button" data-i18n="text.clear">クリア</button>
      </div>
    </div>
    <textarea
      id="text-input"
      rows="8"
      spellcheck="false"
      autocomplete="off"
      data-i18n-placeholder="text.placeholder"
      placeholder="ここに論文やレポートを貼り付けてください。"
    ></textarea>
    <div id="sentence-preview" class="sentence-preview" aria-live="off" hidden></div>
  </section>

  <section class="controls" aria-label="playback controls">
    <div class="progress">
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-text">
        <span id="progress-current">0</span>
        <span> / </span>
        <span id="progress-total">0</span>
        <span data-i18n="progress.sentences">文</span>
      </div>
    </div>

    <div class="button-row">
      <button id="prev-btn" class="ctrl-btn" type="button" aria-label="Previous sentence" title="←">
        <span aria-hidden="true">⏮</span>
      </button>
      <button id="play-btn" class="ctrl-btn ctrl-primary" type="button" aria-label="Play">
        <span class="icon-play" aria-hidden="true">▶</span>
        <span class="icon-pause" aria-hidden="true" hidden>⏸</span>
        <span class="btn-label" data-i18n="ctrl.play">再生</span>
      </button>
      <button id="stop-btn" class="ctrl-btn" type="button" aria-label="Stop" data-i18n-title="ctrl.stop">
        <span aria-hidden="true">⏹</span>
      </button>
      <button id="next-btn" class="ctrl-btn" type="button" aria-label="Next sentence" title="→">
        <span aria-hidden="true">⏭</span>
      </button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
  </section>

  <section class="settings">
    <details>
      <summary data-i18n="settings.title">設定</summary>
      <div class="settings-grid">
        <label class="field">
          <span data-i18n="settings.voice">音声</span>
          <select id="voice-select"></select>
          <small class="hint" data-i18n="settings.voiceHint">端末に保存されているオフライン音声のみ表示されます。</small>
        </label>

        <label class="field">
          <span>
            <span data-i18n="settings.rate">速度</span>
            <output id="rate-value">1.00</output>x
          </span>
          <input id="rate" type="range" min="0.5" max="2.0" step="0.05" value="1.0" />
        </label>

        <label class="field">
          <span>
            <span data-i18n="settings.pitch">ピッチ</span>
            <output id="pitch-value">1.00</output>
          </span>
          <input id="pitch" type="range" min="0.5" max="2.0" step="0.05" value="1.0" />
        </label>

        <label class="field checkbox-field">
          <input id="wake-lock" type="checkbox" />
          <span data-i18n="settings.wakeLock">再生中は画面をスリープさせない</span>
        </label>
      </div>
    </details>
  </section>

  <section class="offline-note">
    <p data-i18n="offline.note">このアプリはオフラインでも動作します。初回アクセス時にキャッシュされ、電波圏外でも起動できます。</p>
  </section>
</main>

<footer class="app-footer">
  <small>
    <span data-i18n="footer.shortcut">ショートカット:</span>
    <kbd>Space</kbd>
    <span data-i18n="footer.playPause">再生/一時停止</span>
    ・
    <kbd>←</kbd> / <kbd>→</kbd>
    <span data-i18n="footer.skip">文スキップ</span>
  </small>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
